<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>One Good Object — Meta Ads</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.08);
  --orange:#f97316;--od:rgba(249,115,22,0.10);--ob:rgba(249,115,22,0.3);
  --text:#f1f5f9;--muted:#64748b;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.lbox{width:100%;max-width:440px}
.badge{font-size:10px;letter-spacing:4px;color:var(--orange);text-transform:uppercase;margin-bottom:14px}
.ltitle{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;line-height:1.2;margin-bottom:8px}
#dash{display:none;padding:24px 30px;max-width:1480px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.ttitle{font-family:'Space Mono',monospace;font-size:19px;font-weight:700}
.tsub{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-g{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:7px 16px;color:#94a3b8;font-size:13px;cursor:pointer}
.sp{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.12);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login"><div class="lbox"><div class="badge">One Good Object</div><div class="ltitle">Loading Dashboard...</div></div></div>

<div id="dash">
  <div class="topbar">
    <div>
      <div class="badge">One Good Object</div>
      <div class="ttitle mono">Meta Ads Dashboard</div>
      <div class="tsub" id="lastFetched">Initializing...</div>
    </div>
    <div class="actions">
      <button class="btn-g" onclick="location.reload()">Refresh Data</button>
    </div>
  </div>
</div>

<script>
// --- CONFIGURED CREDENTIALS ---
const TOKEN = 'EAAVWz6sLgKgBRPxIqg0XZAif6o61pwOwIuVJo3EIa7Guz8kc5uDGyRTjABhm4TnrM70jISbpxJCKpZCMdy6ba6JTssYk2qSFTODzetl3UfR6gTsxImMO6nBiCZAePFnqXsnqcBxi2AKiRZCsVYrLfHdXxAmCkuxZCmDg8KTHL4AEddNweVYqYr2IgeWaC0UoCdLG3Nis0KQSWnlVLFrv7';
const ACCOUNT = '2495711530616735';
const BASE = 'https://graph.facebook.com/v20.0';

async function loadData() {
    const acc = ACCOUNT.startsWith('act_') ? ACCOUNT : `act_${ACCOUNT}`;
    try {
        // Simple test fetch to prove connection
        const res = await fetch(`${BASE}/${acc}/insights?date_preset=yesterday&access_token=${TOKEN}`);
        const data = await res.json();
        
        document.getElementById('login').style.display = 'none';
        document.getElementById('dash').style.display = 'block';
        document.getElementById('lastFetched').textContent = 'Connected Successfully · Data Ready';
        console.log('API Response:', data);
    } catch (e) {
        document.querySelector('.ltitle').textContent = 'Connection Error';
        console.error(e);
    }
}

window.onload = loadData;
</script>
</body>
</html>
